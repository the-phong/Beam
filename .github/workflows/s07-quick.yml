name: S07 quick reproducibility

on:
  pull_request:
    branches:
      - test-mainet
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build and unit tests
        run: go build ./... && go test ./...
      - name: Golden vectors and public corpora
        run: make corpus-s04-verify corpus-s06-verify
      - name: S07 schema and integrity tests
        run: make test-s07-schema
      - name: File 02 common plan and QC tests
        run: make test-file02-common
      - name: Four-validator C/CP/P/H smoke
        run: make test-s07-smoke
      - name: File 02 COMMON-02 fresh-network and phase smoke
        run: make test-file02-common02
